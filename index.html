<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b03a2e">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Hán cổ tự học</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* Layout: ứng dụng một cột — thanh trên (tên app, cấp độ, chuỗi ngày) + thanh chọn mục dính; mỗi mục là một màn hình riêng */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #f7f9fb;
  --ink: #17202b;
  --han: #1b2f4e;
  --muted: #5e6977;
  --line: #dce2e8;
  --accent: #24507f;
  --accent-ink: #ffffff;
  --accent-soft: #e2eaf4;
  --seal: #b03a2e;
  --seal-soft: #f8e6e3;
  --good: #1f7a4d;
  --good-soft: #e1f3e9;
  --warn: #a36307;
  --warn-soft: #fbefdc;
  --gold: #b7860b;
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-han: "MS Song", "MSSong", "SimSun", "宋体", "PMingLiU", "MingLiU", "Noto Serif TC", serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #18202a; --surface-2: #1d2631; --ink: #e6eaef; --han: #dce7f6; --muted: #9ba6b4; --line: #2a3441;
    --accent: #8db4e2; --accent-ink: #0f1722; --accent-soft: #1f2e40; --seal: #e6897b; --seal-soft: #3b2321;
    --good: #6fcf9b; --good-soft: #17362a; --warn: #f0b45a; --warn-soft: #3a2c15; --gold: #e2b843; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #18202a; --surface-2: #1d2631; --ink: #e6eaef; --han: #dce7f6; --muted: #9ba6b4; --line: #2a3441;
  --accent: #8db4e2; --accent-ink: #0f1722; --accent-soft: #1f2e40; --seal: #e6897b; --seal-soft: #3b2321;
  --good: #6fcf9b; --good-soft: #17362a; --warn: #f0b45a; --warn-soft: #3a2c15; --gold: #e2b843; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
.han { font-family: var(--f-han); color: var(--han); font-weight: 400; }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
.brand .seal { width: 34px; height: 34px; border-radius: 7px; background: var(--seal); color: #fff; display: grid; place-items: center; font-family: var(--f-han); font-size: 22px; line-height: 1; }
.stats { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; }
.pill.streak { color: var(--warn); }
.pill.lv { color: var(--accent); }
nav.menu { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
nav.menu::-webkit-scrollbar { display: none; }
nav.menu a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.9rem; padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
nav.menu a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav.menu a .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--seal); color: #fff; font-size: 0.72rem; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }

main { padding-block: 18px 64px; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.45rem; margin: 0 0 4px; }
h2 { font-size: 1.12rem; margin: 0 0 8px; }
h3 { font-size: 1rem; margin: 14px 0 6px; }
p { margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 0.92rem; }
.grid { display: grid; gap: 14px; }
.cols2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card.hero { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); min-height: 40px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.bad { background: var(--seal); border-color: var(--seal); color: #fff; }
.btn.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 0.86rem; }
.btn:disabled { opacity: 0.45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 0.76rem; white-space: nowrap; }
.chip.k10 { background: var(--seal-soft); color: var(--seal); }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.nb { color: var(--muted); font-style: italic; }
.nb::before { content: "※ "; font-style: normal; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* tasks + progress */
.task { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.task .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-han); font-size: 24px; background: var(--accent-soft); color: var(--accent); }
.task .ic.red { background: var(--seal-soft); color: var(--seal); }
.task .ic.green { background: var(--good-soft); color: var(--good); }
.task .ic.amber { background: var(--warn-soft); color: var(--warn); }
.task b { display: block; }
.task small { color: var(--muted); }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
.bar i.a { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.bar i.b { background: var(--accent); }
.bar i.c { background: var(--good); height: 40%; top: auto; }
.prog { display: grid; gap: 4px; padding: 8px 0; }
.prog .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; flex-wrap: wrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--k); }
.weeks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0 4px; }
.weeks div { border-radius: 8px; padding: 6px 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 0.78rem; min-width: 0; }
.weeks div.now { border-color: var(--accent); background: var(--accent-soft); }
.weeks div.done { opacity: 0.6; }
.weeks b { display: block; font-size: 0.82rem; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.bdg { display: grid; justify-items: center; gap: 2px; width: 84px; text-align: center; font-size: 0.72rem; color: var(--muted); }
.bdg .m { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-han); font-size: 22px; border: 2px dashed var(--line); color: var(--muted); }
.bdg.on .m { border: 2px solid var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
.bdg.on { color: var(--ink); }

/* flashcards */
.stage { display: grid; gap: 14px; justify-items: center; }
.fc { width: min(560px, 100%); min-height: 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; align-content: center; justify-items: center; gap: 10px; text-align: center; position: relative; }
.fc .kind { position: absolute; top: 12px; left: 14px; font-size: 0.75rem; color: var(--muted); font-weight: 600; }
.fc .cnt { position: absolute; top: 12px; right: 14px; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.big { font-family: var(--f-han); color: var(--han); line-height: 1.1; font-size: clamp(64px, 18vw, 120px); }
.big.l2 { font-size: clamp(48px, 13vw, 88px); } .big.l3 { font-size: clamp(40px, 10vw, 72px); } .big.l4 { font-size: clamp(32px, 8vw, 56px); } .big.l6 { font-size: clamp(24px, 6vw, 40px); line-height: 1.4; }
.ans { display: grid; gap: 4px; justify-items: center; }
.ans .am { font-size: 1.35rem; font-weight: 700; }
.ans .ns { max-width: 46ch; }
.ans .extra { font-size: 0.85rem; color: var(--muted); max-width: 52ch; }
.grades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(560px, 100%); }
.grades .btn { flex-direction: column; gap: 0; padding: 8px; }
.grades .btn small { font-weight: 500; opacity: 0.8; font-size: 0.72rem; }
.kbd { font-size: 0.75rem; color: var(--muted); }
.hide { visibility: hidden; }

/* learn detail */
.learn { width: min(640px, 100%); display: grid; gap: 12px; }
.learn .top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.learn .top .big { font-size: clamp(72px, 20vw, 112px); }
.facts { display: grid; gap: 6px; font-size: 0.92rem; }
.facts .k { color: var(--muted); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.minis { display: flex; flex-wrap: wrap; gap: 6px; }
.mini { border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; background: var(--surface-2); font-size: 0.85rem; cursor: pointer; }
.mini .han { font-size: 1.1rem; margin-right: 4px; }

/* choices */
.choices { display: grid; gap: 8px; width: min(560px, 100%); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices.one { grid-template-columns: 1fr; }
.choice { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; font-weight: 500; min-height: 48px; }
.choice:hover { border-color: var(--accent); }
.choice.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.choice.wrong { background: var(--seal-soft); border-color: var(--seal); color: var(--seal); }
.choice .han { font-size: 1.5rem; }
.feedback { min-height: 24px; font-weight: 600; text-align: center; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--seal); }

/* writing pad */
.padwrap { display: grid; gap: 8px; justify-items: center; width: 100%; }
canvas.pad { touch-action: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; max-width: 100%; cursor: crosshair; }

/* games */
.games { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.gcard { text-align: left; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface); cursor: pointer; display: grid; gap: 4px; }
.gcard:hover { border-color: var(--accent); }
.gcard .gi { font-family: var(--f-han); font-size: 30px; color: var(--seal); line-height: 1; }
.gcard b { font-size: 1rem; }
.gcard small { color: var(--muted); }
.gcard .best { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
.ghead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.ghead .score { margin-left: auto; display: flex; gap: 8px; }
.memo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: min(560px, 100%); }
.memo button { aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid var(--line); background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; padding: 4px; font-weight: 600; font-size: 0.82rem; min-width: 0; overflow: hidden; }
.memo button.open, .memo button.done { background: var(--surface); color: var(--ink); }
.memo button.done { border-color: var(--good); background: var(--good-soft); }
.memo button .han { font-size: clamp(22px, 6vw, 34px); }
.rain { position: relative; height: 360px; width: min(560px, 100%); background: linear-gradient(var(--surface), var(--surface-2)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.drop { position: absolute; top: 0; font-family: var(--f-han); color: var(--han); font-size: 34px; line-height: 1; padding: 4px 6px; border-radius: 8px; background: color-mix(in srgb, var(--surface) 80%, transparent); white-space: nowrap; }
.drop.hit { color: var(--good); }
.rain .floor { position: absolute; inset: auto 0 0 0; height: 4px; background: var(--seal); opacity: 0.6; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(560px, 100%); }
.tile { font-family: var(--f-han); font-size: 30px; color: var(--han); min-width: 52px; height: 56px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; padding: 0 8px; }
.tile.used { opacity: 0.25; cursor: default; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 60px; width: min(560px, 100%); padding: 6px; border: 1px dashed var(--line); border-radius: 10px; }
.slots .tile { background: var(--accent-soft); }
.baskets { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; width: min(640px, 100%); }
.baskets .btn { font-size: 0.82rem; padding: 10px 4px; min-height: 56px; white-space: normal; line-height: 1.2; }
.hunt { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: min(480px, 100%); }
.hunt button { font-family: var(--f-han); font-size: 34px; color: var(--han); aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.hunt button.sel { border: 2px solid var(--accent); background: var(--accent-soft); }
.hunt button.right { border: 2px solid var(--good); background: var(--good-soft); }
.hunt button.wrong { border: 2px solid var(--seal); background: var(--seal-soft); }
.hunt button.miss { border: 2px dashed var(--warn); }
.sent { font-family: var(--f-han); color: var(--han); font-size: clamp(22px, 5vw, 30px); line-height: 1.9; text-align: center; }
.sent .hl { color: var(--seal); border-bottom: 3px solid var(--seal); }
.sent .blank { display: inline-block; min-width: 1.2em; border-bottom: 3px solid var(--accent); color: var(--accent); }
ruby rt { font-family: var(--f-ui); font-size: 0.42em; color: var(--muted); letter-spacing: 0; }
.norubies rt { visibility: hidden; }
.timer { height: 6px; width: min(560px, 100%); background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.timer i { display: block; height: 100%; background: var(--warn); }
.result { text-align: center; display: grid; gap: 8px; justify-items: center; }
.result .score-big { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }

/* lists */
.list { display: grid; }
.li { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.li:first-child { border-top: 0; }
.li .g { font-family: var(--f-han); color: var(--han); font-size: 30px; text-align: center; line-height: 1.1; }
.li .g.l3 { font-size: 22px; } .li .g.l4 { font-size: 17px; }
.li .t { min-width: 0; }
.li .t b { display: block; }
.li .t span { color: var(--muted); font-size: 0.86rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.radgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.rad { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px 4px; cursor: pointer; display: grid; justify-items: center; gap: 0; }
.rad .han { font-size: 30px; line-height: 1.2; }
.rad small { font-size: 0.72rem; color: var(--muted); }
.rad.known { border-color: var(--good); }
.ltgroup .chars { display: flex; flex-wrap: wrap; gap: 6px; }
.field { display: grid; gap: 4px; }
.field input, .field select, textarea, input[type="search"], input[type="text"] { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; width: 100%; }
input.answer { font-size: 1.15rem; text-align: center; max-width: 420px; }
textarea { min-height: 110px; font-family: ui-monospace, monospace; font-size: 0.78rem; }
.tablebox { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.t td, table.t th { padding: 7px 8px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
table.t th { border-top: 0; font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

/* modal + toast */
.modal { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, #000 45%, transparent); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .box { background: var(--surface); border-radius: 16px; max-width: 640px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px; position: relative; }
.modal .x { position: absolute; top: 10px; right: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-width: calc(100% - 32px); }
.xpfly { position: fixed; z-index: 61; font-weight: 800; color: var(--gold); pointer-events: none; animation: fly 0.9s ease-out forwards; }
@keyframes fly { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }
@keyframes pop { 0% { transform: scale(0.96); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
.pop { animation: pop 0.25s ease-out; }
@media (prefers-reduced-motion: reduce) { .xpfly, .pop { animation: none; } }

@media (max-width: 600px) {
  .stats .pill.xp { display: none; }
  .brand span.name { display: none; }
  .weeks { grid-template-columns: repeat(5, minmax(56px, 1fr)); overflow-x: auto; }
  .baskets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .learn .top { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .choices { grid-template-columns: 1fr; }
}
@media print {
  .topbar, body::before, .noprint { display: none !important; }
  body { background: #fff; }
}
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><div class="seal" aria-hidden="true">學</div><span class="name">Hán cổ tự học</span></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="wrap"><nav class="menu" id="menu" aria-label="Các mục"></nav></div>
</header>
<main class="wrap" id="view" tabindex="-1"><div class="card"><p class="sub">Đang tải dữ liệu bài học…</p></div></main>
<div id="layer"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
