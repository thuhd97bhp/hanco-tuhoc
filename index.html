<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b03a2e">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Hán cổ tự học</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* "HanS" = MS Song đã cài trên máy, CHỈ cho chữ Hán (unicode-range) → chữ Hán xen trong chữ giao diện / ô gõ hiện MS Song, ký hiệu
   khác (※ ★ ✓ ←) giữ phông cũ. Máy không có MS Song: bỏ qua, chữ Hán được đổi sang ảnh (sgText / inOv trong app.js). */
@font-face { font-family: "HanS"; src: local("MS Song"), local("MSSong"); unicode-range: U+2E80-2FDF, U+3001-3003, U+3005-3007, U+3008-3011, U+3021-3029, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF01, U+FF08-FF09, U+FF0C, U+FF0E, U+FF1A-FF1B, U+FF1F, U+20000-3FFFF; }
/* Layout: ứng dụng một cột — thanh trên (tên app, cấp độ, chuỗi ngày) + thanh chọn mục dính; mỗi mục là một màn hình riêng */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #f7f9fb;
  --ink: #17202b;
  --han: #1b2f4e;
  --muted: #5e6977;
  --line: #dce2e8;
  --accent: #24507f;
  --accent-ink: #ffffff;
  --accent-soft: #e2eaf4;
  --seal: #b03a2e;
  --seal-soft: #f8e6e3;
  --good: #1f7a4d;
  --good-soft: #e1f3e9;
  --warn: #a36307;
  --warn-soft: #fbefdc;
  --gold: #b7860b; --silver: #7d838d; --bronze: #a0612b;
  --nt-purple: #7a3fa6; --nt-yel: #fff1a6;
  --f-ui: "Be Vietnam Pro", "Segoe UI", "HanS", system-ui, sans-serif;
  --f-han: "MS Song", "MSSong", "SimSun", "宋体", "PMingLiU", "MingLiU", "Noto Serif TC", serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #18202a; --surface-2: #1d2631; --ink: #e6eaef; --han: #dce7f6; --muted: #9ba6b4; --line: #2a3441;
    --accent: #8db4e2; --accent-ink: #0f1722; --accent-soft: #1f2e40; --seal: #e6897b; --seal-soft: #3b2321;
    --good: #6fcf9b; --good-soft: #17362a; --warn: #f0b45a; --warn-soft: #3a2c15; --gold: #e2b843; --silver: #c4c9d1; --bronze: #d6935c; --nt-purple: #c7a2ec; --nt-yel: #4d4413; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #18202a; --surface-2: #1d2631; --ink: #e6eaef; --han: #dce7f6; --muted: #9ba6b4; --line: #2a3441;
  --accent: #8db4e2; --accent-ink: #0f1722; --accent-soft: #1f2e40; --seal: #e6897b; --seal-soft: #3b2321;
  --good: #6fcf9b; --good-soft: #17362a; --warn: #f0b45a; --warn-soft: #3a2c15; --gold: #e2b843; --silver: #c4c9d1; --bronze: #d6935c; --nt-purple: #c7a2ec; --nt-yel: #4d4413; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
.han { font-family: var(--f-han); color: var(--han); font-weight: 400; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
/* thanh trên: 1 khối duy nhất; hẹp → 2 hàng (tên app + điểm, rồi thanh mục); rộng hoặc máy nằm ngang thấp → 1 hàng (xem @media cuối file) */
.topbar .tb { display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; padding-top: 10px; }
.topbar .brand { order: 1; }
.topbar .stats { order: 2; }
.topbar nav.menu { order: 3; flex: 1 0 100%; margin-top: 8px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
.brand .seal { width: 34px; height: 34px; border-radius: 7px; background: var(--seal); color: #fff; display: grid; place-items: center; font-family: var(--f-han); font-size: 22px; line-height: 1; }
.stats { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; }
.pill.streak { color: var(--warn); }
.pill.lv { color: var(--accent); }
/* khung thẻ tài khoản (renderStats): ngoài thanh dọc mở rộng thì "trong suốt" → các viên xếp như cũ, giữ thứ tự cũ bằng order */
.sc-hd, .sc-who, .sc-st { display: contents; }
.sc-n, .sc-pg, .stats .sk { display: none; }
.stats .pill.cl { order: 1; } .stats .pill.streak { order: 2; } .stats .pill.lv { order: 3; } .stats .pill.xp { order: 4; } .stats .tbxbtn { order: 5; } .stats .avtop { order: 6; }
/* ảnh đại diện (27/11/2026): vòng tròn ảnh (chưa có ảnh → chữ cái đầu trên nền màu), nút ảnh trên thanh → menu tài khoản, khung xem ảnh to */
.av { --avs: 34px; flex: none; display: inline-grid; place-items: center; width: var(--avs); height: var(--avs); border-radius: 50%; overflow: hidden;
  background: var(--avbg, var(--accent)) center / cover no-repeat; color: #fff; font-weight: 700; font-size: calc(var(--avs) * 0.44); line-height: 1;
  border: 0; padding: 0; font-family: inherit; user-select: none; }
.av.img { color: transparent; background-color: var(--surface-2); }
button.av { cursor: zoom-in; }
button.av:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.av.sm { --avs: 26px; }
.av.lg { --avs: 48px; }
.av.xl { --avs: 72px; }
.avtop { flex: none; display: inline-grid; place-items: center; padding: 1px; border: 2px solid transparent; border-radius: 50%; background: none; cursor: pointer; margin: -6px 0; } /* lề âm: vùng bấm 36px nhưng không làm thanh trên cao thêm */
.avtop .av { --avs: 30px; }
.avtop:hover, .avtop[aria-expanded="true"] { border-color: var(--accent); }
.avtop:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.avmenu { position: fixed; z-index: 70; width: min(300px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.22); padding: 6px; display: grid; gap: 2px; }
.avmenu .avm-hd { display: flex; align-items: center; gap: 12px; padding: 8px 8px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.avmenu .avm-t { display: grid; min-width: 0; line-height: 1.3; }
.avmenu .avm-t b, .avmenu .avm-t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avmenu .avm-t small { font-size: 0.78rem; }
.avmenu button[data-avm] { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 8px 10px; border: 0; border-radius: 10px; background: none; color: var(--ink); text-align: left; font-weight: 500; cursor: pointer; }
.avmenu button[data-avm]:hover, .avmenu button[data-avm]:focus-visible { background: var(--surface-2); outline: none; }
.avmenu .avm-ic { width: 22px; text-align: center; color: var(--muted); font-size: 1.05rem; }
.avmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
/* Thông báo (27/11/2026): nút chuông cạnh nút ảnh + khung danh sách */
.tbxbtn { position: relative; flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; margin: -6px 0; padding: 0; border: 0; border-radius: 50%; background: none; font-size: 1.15rem; line-height: 1; cursor: pointer; }
.tbxbtn:hover { background: var(--surface-2); }
.tbxbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.tbxbtn .tbxn { position: absolute; top: 0; right: -2px; min-width: 17px; padding: 0 4px; border-radius: 999px; background: var(--seal); color: #fff; font-size: 0.68rem; font-weight: 700; line-height: 17px; text-align: center; box-shadow: 0 0 0 2px var(--surface); }
.tbx-list { display: grid; gap: 6px; }
.tbx-it { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
.tbx-it:hover, .tbx-it:focus-visible { background: var(--surface-2); }
.tbx-it.tinh { cursor: default; }
.tbx-it.moi { border-color: var(--accent); background: var(--accent-soft); }
.tbx-ic { flex: none; width: 24px; font-size: 1.1rem; line-height: 1.4; text-align: center; }
.tbx-m { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; line-height: 1.4; }
.tbx-m small { font-size: 0.78rem; }
.modal.avmodal { z-index: 65; } /* trên khung chi tiết (50) và khung cách nhớ (60), dưới menu bật lên (70) */
.avmodal .box { max-width: 520px; }
.avbig { display: grid; place-items: center; min-height: 160px; margin: 8px 0 12px; }
.avbig img { display: block; width: min(384px, 100%, calc(100dvh - 240px)); min-width: 160px; aspect-ratio: 1; object-fit: cover; border-radius: 16px; border: 1px solid var(--line); }
.avpf { gap: 14px; align-items: center; flex-wrap: nowrap; }
/* ảnh đại diện mặc định (27/11/2026): khung "Chọn ảnh có sẵn" + Quản trị → Ảnh mặc định */
.av.md { background-color: var(--surface-2); }
.avmgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; max-height: min(52vh, 480px); overflow: auto; padding: 4px; margin: 8px 0; overscroll-behavior: contain; }
.avmc { display: block; width: 100%; padding: 0; border: 3px solid transparent; border-radius: 50%; background: none; cursor: pointer; overflow: hidden; line-height: 0; }
.avmc img { display: block; width: 100%; height: auto; border-radius: 50%; }
.avmc:hover, .avmc:focus-visible { border-color: var(--accent); outline: none; }
.avmc[aria-current] { border-color: var(--good, var(--accent)); }
.qtamg { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.qtam { display: grid; justify-items: center; align-content: start; gap: 4px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: center; min-width: 0; }
.qtam img { width: 72px; height: 72px; border-radius: 50%; }
.qtam small { overflow-wrap: anywhere; line-height: 1.35; }
.qtam .btn { margin-top: auto; }
.qtam.gone { background: var(--surface-2); }
.qtam.gone img { filter: grayscale(1); opacity: .45; }
.avpf h2 { margin: 0 0 2px; overflow-wrap: anywhere; }
.avpf > div { min-width: 0; }
/* hai vai của quản trị viên (27/11/2026): Cài đặt → Tài khoản */
.vaih { margin: 18px 0 4px; font-size: 1.05rem; }
.vai2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 10px; margin: 8px 0; }
.vaic { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); min-width: 0; }
.vaihd { gap: 10px; align-items: center; flex-wrap: nowrap; }
.vait { display: grid; min-width: 0; }
.vaich { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 10px; margin: 6px 0 2px; }
.vaiq { display: grid; gap: 4px; min-width: 0; }
.vaios { display: flex; flex-wrap: wrap; gap: 6px; }
.vaio { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); cursor: pointer; }
.vaio:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.vaio.dis { opacity: 0.55; cursor: not-allowed; }
.vaipwf { display: grid; gap: 8px; max-width: 420px; }
nav.menu { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
nav.menu::-webkit-scrollbar { display: none; }
nav.menu a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.9rem; padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
nav.menu a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav.menu a .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--seal); color: #fff; font-size: 0.72rem; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
/* thanh mục ở trên (khung hẹp / dọc): mục không vừa 1 hàng dồn vào nút » cuối hàng (fitMenu trong app.js). Ký hiệu chữ Hán + nhãn ngắn chỉ dùng ở thanh dọc (xem @media cuối file) */
nav.menu a .ic, nav.menu a .sl, .mtog, .msrt { display: none; }
nav.menu a .ic { font-family: var(--f-han); font-weight: 400; line-height: 1; }
nav.menu .mhid { display: none !important; }
.mmore { position: relative; flex: none; margin-left: auto; min-width: 44px; padding: 5px 12px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 800; font-size: 1rem; line-height: 1.2; cursor: pointer; }
.mmore:hover, .mmore[aria-expanded="true"] { color: var(--ink); background: var(--accent-soft); }
.mmore.cur { background: var(--accent); color: var(--accent-ink); }
.mmore .dot { display: none; position: absolute; top: 2px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--seal); border: 2px solid var(--surface); }
.mmore.has-b .dot { display: block; }
.mtog, .msrt { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; place-items: center; font-size: 1rem; padding: 0; flex: none; }
.mtog:hover, .msrt:hover { color: var(--ink); border-color: var(--accent); }
/* danh sách mục ẩn (bấm ») + khung sắp xếp thanh mục */
.pop a.pmi { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 600; }
.pop a.pmi:hover, .pop a.pmi:focus-visible { background: var(--accent-soft); color: var(--accent); }
.pop a.pmi[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.pop .ic, .msort .ic { font-family: var(--f-han); font-weight: 400; width: 22px; text-align: center; font-size: 19px; line-height: 1; flex: none; }
.pop .badge { margin-left: auto; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--seal); color: #fff; font-size: 0.72rem; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.msort { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.msort li { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.msort li .no { color: var(--muted); font-size: 0.8rem; width: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.msort li .lb { flex: 1; min-width: 0; font-weight: 600; }
.msort li .btn { min-width: 44px; min-height: 40px; padding: 4px 10px; }
.msort li.vis { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.modal .acts { background: var(--surface); }

main { padding-block: 18px 64px; }
main:focus { outline: none; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.45rem; margin: 0 0 4px; }
h2 { font-size: 1.12rem; margin: 0 0 8px; }
h3 { font-size: 1rem; margin: 14px 0 6px; }
p { margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 0.92rem; }
.grid { display: grid; gap: 14px; }
.cols2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card.hero { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); min-height: 40px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.bad { background: var(--seal); border-color: var(--seal); color: #fff; }
.btn.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 0.86rem; }
.btn:disabled { opacity: 0.45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 0.76rem; white-space: nowrap; }
.chip.k10 { background: var(--seal-soft); color: var(--seal); }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.nb { color: var(--muted); font-style: italic; }
.nb::before { content: "※ "; font-style: normal; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* tasks + progress */
.task { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.task .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-han); font-size: 24px; background: var(--accent-soft); color: var(--accent); }
.task .ic.red { background: var(--seal-soft); color: var(--seal); }
.task .ic.green { background: var(--good-soft); color: var(--good); }
.task .ic.amber { background: var(--warn-soft); color: var(--warn); }
.task b { display: block; }
.task small { color: var(--muted); }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
.bar i.a { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.bar i.b { background: var(--accent); }
.bar i.c { background: var(--good); height: 40%; top: auto; }
.prog { display: grid; gap: 4px; padding: 8px 0; }
.prog .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; flex-wrap: wrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--k); }
.weeks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0 4px; }
.weeks div { border-radius: 8px; padding: 6px 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 0.78rem; min-width: 0; }
.weeks div.now { border-color: var(--accent); background: var(--accent-soft); }
.weeks div.done { opacity: 0.6; }
.weeks b { display: block; font-size: 0.82rem; }
/* lộ trình theo kỳ (26/11/2026): dòng từng kỳ + thanh chặng, tiêu đề kỳ trong "Việc hôm nay", khung chọn kỳ */

.fc .cnt { position: absolute; top: 12px; right: 14px; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.big { font-family: var(--f-han); color: var(--han); line-height: 1.1; font-size: clamp(64px, 18vw, 120px); }
.big.l2 { font-size: clamp(48px, 13vw, 88px); } .big.l3 { font-size: clamp(40px, 10vw, 72px); } .big.l4 { font-size: clamp(32px, 8vw, 56px); } .big.l6 { font-size: clamp(24px, 6vw, 40px); line-height: 1.4; }

/* hàng nút / khung kết quả đang ẩn thì KHÔNG giữ chỗ (chỉ đáp án trong thẻ .fc giữ chỗ để thẻ không nhảy) */
.row.hide, .gfb.hide, .gtwrap.hide, .acts.hide { display: none; }

/* learn detail */
.learn { width: min(640px, 100%); display: grid; gap: 12px; }
.learn .top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.learn .top .big:not(.l2):not(.l3):not(.l4):not(.l6) { font-size: clamp(72px, 20vw, 112px); }
.learn .top.nobig { grid-template-columns: minmax(0, 1fr); }
/* hoạt hình thứ tự nét (thay chữ to): nền ô có đường kẻ, nét đang viết đỏ, nét đã viết màu chữ Hán */
.ani { --c: clamp(150px, 44vw, 200px); display: grid; justify-items: center; gap: 4px; }
.ani.n2 { --c: clamp(104px, 30vw, 132px); } .ani.n4 { --c: clamp(60px, 17vw, 84px); } .ani.n6 { --c: clamp(46px, 12vw, 62px); }
.acells { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(var(--c) * 4 + 18px); cursor: pointer; }
.acell { width: var(--c); height: var(--c); border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.acell svg { width: 100%; height: 100%; display: block; }
.acell .agrid { fill: none; stroke: var(--line); stroke-width: 5; stroke-dasharray: 22 18; }
.acell .ao { fill: var(--line); }
.acell .as { fill: none; stroke: var(--han); stroke-width: 200; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
.acell .as.on { stroke: var(--seal); visibility: visible; }
.acell .as.dn { visibility: visible; }
.acell.nodata .big { font-size: calc(var(--c) * 0.72); line-height: 1; }
.areplay { position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0; }
.ani.n4 .areplay, .ani.n6 .areplay { width: 24px; height: 24px; font-size: 14px; right: -4px; bottom: -4px; }
.anote { font-size: 0.75rem; color: var(--muted); max-width: calc(var(--c) * 4); text-align: center; }
.anote:empty { display: none; }
/* phần bộ trong chữ (tô màu) + ô hoạt hình nhỏ cho dạng rút gọn / dạng bộ / chữ ví dụ */
.acell .ao.rb { fill: color-mix(in srgb, var(--warn) 30%, var(--line)); }
.acell .as.rb.dn { stroke: var(--warn); }
.ani.sm { --c: clamp(64px, 18vw, 84px); } .ani.sm.n2 { --c: clamp(52px, 14vw, 66px); } .ani.sm.n4 { --c: 42px; } .ani.sm.n6 { --c: 34px; }
.ani.xs { --c: 50px; } .ani.xs .areplay { display: none; }
.ani.sm .areplay { width: 22px; height: 22px; font-size: 13px; right: -4px; bottom: -4px; }
.ani.sm .acell, .ani.xs .acell { border-radius: 8px; }
.big.sm, .big.xs { font-size: 40px; }
.alt { display: grid; gap: 8px; }
.altrow { display: flex; gap: 12px; align-items: flex-start; padding-top: 8px; border-top: 1px dashed var(--line); }
.altrow > .ani { flex: none; }
.altt { display: grid; gap: 3px; min-width: 0; font-size: 0.9rem; }
.gtt { font-size: 1.9rem; line-height: 1.15; }
.extra .gtt { font-size: 1.15rem; }
.fex { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.fx { display: grid; justify-items: center; gap: 2px; font-size: 0.82rem; text-align: center; }
a.lk { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
.gtwrap { display: grid; gap: 8px; justify-items: center; width: 100%; padding-top: 10px; border-top: 1px dashed var(--line); }
.learn .sent ruby { margin: 0 0.12em; }
.facts { display: grid; gap: 6px; font-size: 0.92rem; }
.facts .k { color: var(--muted); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.pace { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start; margin: 12px 0; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); }
.pace .pi { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-han); font-size: 30px; line-height: 1; }
.pace .ph { font-size: 1.35rem; display: block; margin-bottom: 2px; }
.pace .sub { margin: 4px 0 0; }
.pace.good { border-color: var(--good); } .pace.good .pi { background: var(--good-soft); color: var(--good); } .pace.good .ph { color: var(--good); }
.pace.warn { border-color: var(--warn); } .pace.warn .pi { background: var(--warn-soft); color: var(--warn); } .pace.warn .ph { color: var(--warn); }
.pace.bad { border-color: var(--seal); } .pace.bad .pi { background: var(--seal-soft); color: var(--seal); } .pace.bad .ph { color: var(--seal); }
.pbars { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 20px; }
.pb { display: grid; gap: 4px; padding: 6px 0; }
.pb .lab { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: 0.88rem; }
.bar2 { position: relative; height: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; margin: 4px 0; }
.bar2 i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
.bar2 i.good { background: var(--good); } .bar2 i.warn { background: var(--warn); } .bar2 i.bad { background: var(--seal); }
.bar2 s { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
.wkr, .wkh { display: grid; grid-template-columns: 92px repeat(7, minmax(0, 1fr)); gap: 4px; align-items: center; margin: 4px 0; max-width: 560px; }
.wkh span { text-align: center; font-size: 0.74rem; color: var(--muted); }
.wl { display: grid; line-height: 1.2; font-size: 0.85rem; } .wl small { color: var(--muted); font-size: 0.72rem; }
.dc { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; padding: 0; font-variant-numeric: tabular-nums; }
.dc.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.dc.part { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.dc.miss { background: var(--seal-soft); color: var(--seal); border-color: transparent; }
.dc.rv { background: var(--surface-2); color: var(--muted); }
.dc.end { border-style: dashed; background: transparent; cursor: default; }
.dc.rv.did { color: var(--good); }
.dc.fin { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dc.fin.miss { background: var(--seal-soft); color: var(--seal); }
.dc.now { border: 2px solid var(--accent); color: var(--accent); }
.dc.sel { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
#lich { scroll-margin-top: 130px; }
@media (max-width: 600px) {
  .pace { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 10px; }
  .pace .pi { width: 40px; height: 40px; font-size: 22px; }
  .pace .ph { font-size: 1.15rem; }
  .wkr, .wkh { grid-template-columns: 62px repeat(7, minmax(0, 1fr)); gap: 3px; }
  .dc { font-size: 0.76rem; }
}
.dayd { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.dayd h3 { margin: 10px 0 6px; font-size: 0.95rem; }
.mini.got { border-color: var(--good); }
.mini.got::after { content: " ✓"; color: var(--good); font-weight: 700; }
.minis { display: flex; flex-wrap: wrap; gap: 6px; }
.mini { border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; background: var(--surface-2); font-size: 0.85rem; cursor: pointer; }
.mini .han { font-size: 1.1rem; margin-right: 4px; }

/* choices */
.choices { display: grid; gap: 8px; width: min(560px, 100%); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices.one { grid-template-columns: 1fr; }
.choice { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; font-weight: 500; min-height: 48px; }
.choice:hover { border-color: var(--accent); }
.choice.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.choice.wrong { background: var(--seal-soft); border-color: var(--seal); color: var(--seal); }
.choice .han { font-size: 1.5rem; }
.feedback { min-height: 24px; font-weight: 600; text-align: center; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--seal); }

/* writing pad */
.padwrap { display: grid; gap: 8px; justify-items: center; width: 100%; }
.songimg { display: inline-block; width: 1.25em; height: 1.25em; margin: -0.125em; vertical-align: -0.24em; background: currentColor; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
/* chữ Hán đổi sang ảnh MS Song (app.js sgText): !important để các luật kiểu ".x span {…}" không đè lên ô chữ */
.sg { display: inline-block !important; position: relative !important; width: 1em !important; height: 1em !important; line-height: 1 !important; vertical-align: -0.12em !important; margin: 0 !important; padding: 0 !important; border: 0 !important; background: none !important; color: inherit !important; font-size: inherit !important; overflow: visible !important; text-indent: 0; }
.sg { font-family: var(--f-han) !important; } /* chữ chưa / không có ảnh (chữ ngoài dữ liệu) → phông Tống dự phòng (SimSun / Noto Serif TC) */
.sg.on { -webkit-text-fill-color: transparent; }
/* ô gõ có chữ Hán trên máy không có MS Song: chữ thật trong ô trong suốt (vẫn có con trỏ), lớp .inov đè lên hiện ảnh MS Song (inOv trong app.js) */
.inhan { color: transparent !important; -webkit-text-fill-color: transparent !important; caret-color: var(--ink); }
.inov { position: absolute; pointer-events: none; overflow: hidden; box-sizing: border-box; border-color: transparent !important; border-style: solid; background: none !important; color: var(--ink); z-index: 1; margin: 0; }
.inov > span { display: block; }
.sg.on::before { content: ""; position: absolute; left: -0.125em; top: -0.125em; width: 1.25em; height: 1.25em; background: currentColor; -webkit-mask: var(--sg) center / 100% 100% no-repeat; mask: var(--sg) center / 100% 100% no-repeat; pointer-events: none; }
.gfb { width: min(560px, 100%); display: grid; gap: 4px; font-size: 0.92rem; }
.gfb .han { font-size: 1.3rem; margin-right: 4px; }
.gfb .ok { color: var(--good); }
.gfb .no { color: var(--seal); }
.gfb .verdict { font-weight: 800; font-size: 1.15rem; text-align: center; }
.gfb .verdict small { font-weight: 500; font-size: 0.8rem; }
/* ===== BỐ CỤC CHUNG CHO 3 LOẠI MÁY (điện thoại, máy tính bảng, máy tính) =====
   .acts  = thanh nút chính của mỗi bước (Xem đáp án, Quên/Nhớ, Chấm điểm, Tiếp…): dính đáy màn hình khi nội dung dài,
            nên KHÔNG BAO GIỜ phải kéo xuống mới bấm được. Màn mới có nút chính → bọc trong .acts.
   .work  = màn làm bài có ô viết: 1 cột (điện thoại, máy tính bảng dọc); 2 cột khi màn rộng/nằm ngang
            (trái: đề + kết quả chấm; phải: ô viết + nút). Thứ tự HTML: .winfo, .wpadc, .wfb, .gtwrap. */
.acts { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; width: 100%; padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
.card .acts { background: var(--surface); }
.acts > .grades { margin: 0 auto; }
.acts > .row { gap: 8px; justify-content: center; }
.work { display: grid; gap: 12px; width: 100%; justify-items: center; }
.work > div { width: min(560px, 100%); min-width: 0; }
.winfo { display: grid; gap: 8px; justify-items: center; }
.winfo .fc { width: 100%; }
.wpadc { display: grid; gap: 8px; justify-items: center; }
.wfb { display: grid; gap: 8px; justify-items: center; }
.wfb:empty { display: none; }
.work > .gtwrap { width: min(560px, 100%); }
/* chế độ tập viết gián tiếp (người dùng yêu cầu 27/11/2026): hướng dẫn, khích lệ, khung đáp án, lựa chọn ở Cài đặt */
.vhd { width: 100%; font-size: 0.9rem; line-height: 1.45; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface-2); }
.vkh { width: 100%; font-size: 0.86rem; line-height: 1.45; color: var(--good); }
.vmode { width: 100%; font-size: 0.8rem; color: var(--muted); }
.vguide { width: min(560px, 100%); display: grid; gap: 8px; }
.vans { width: 100%; min-height: 150px; display: grid; gap: 6px; place-items: center; align-content: center; text-align: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
@media (max-height: 720px) { .vans { min-height: 110px; } }
.vgt { font-size: 0.9rem; color: var(--muted); }
.vgt .han { font-size: 1.4rem; color: var(--ink); }
.vopt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.vopt input { margin-top: 4px; flex: none; }
.vopt > span { display: grid; gap: 2px; }
.vopt .muted { font-size: 0.86rem; }
canvas.pad { touch-action: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; max-width: 100%; cursor: crosshair; }

/* games */
.games { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.gcard { text-align: left; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface); cursor: pointer; display: grid; gap: 4px; }
.gcard:hover { border-color: var(--accent); }

.gcard b { font-size: 1rem; }
.gcard small { color: var(--muted); }
.gcard .best { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
.ghead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.ghead .score { margin-left: auto; display: flex; gap: 8px; }
.memo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: min(560px, 100%); }
/* bàn lật thẻ 3 hàng × 4: thu nhỏ theo chiều cao màn hình để cả bàn nằm trong màn (máy nằm ngang) */
.memo { width: min(560px, 100%, max(280px, (100dvh - 170px) * 1.3)); }
.memo button { aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid var(--line); background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; padding: 4px; font-weight: 600; font-size: 0.82rem; min-width: 0; overflow: hidden; }
.memo button.open, .memo button.done { background: var(--surface); color: var(--ink); }
.memo button.done { border-color: var(--good); background: var(--good-soft); }
.memo button .han { font-size: clamp(22px, 6vw, 34px); }
.rain { position: relative; height: 360px; width: min(560px, 100%); background: linear-gradient(var(--surface), var(--surface-2)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.drop { position: absolute; top: 0; font-family: var(--f-han); color: var(--han); font-size: 34px; line-height: 1; padding: 4px 6px; border-radius: 8px; background: color-mix(in srgb, var(--surface) 80%, transparent); white-space: nowrap; }
.drop.hit { color: var(--good); }
.rain .floor { position: absolute; inset: auto 0 0 0; height: 4px; background: var(--seal); opacity: 0.6; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(560px, 100%); }
.tile { font-family: var(--f-han); font-size: 30px; color: var(--han); min-width: 52px; height: 56px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; padding: 0 8px; }
.tile.used { opacity: 0.25; cursor: default; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 60px; width: min(560px, 100%); padding: 6px; border: 1px dashed var(--line); border-radius: 10px; }

/* giải đấu tuần (27/11/2026): khiên 7 giải (chữ Hán giữa khiên), vạch nhóm thăng / xuống hạng.
   Kiểu 3D (28/11/2026): màu theo lớp .tN (--gl sáng · --gc giữa · --gd tối · --ge/--gk cạnh · --gh chữ); .gbig = 12 lớp chồng (.gl) trong .g3 xoay nghiêng */
.gds { --gl: #ffd6ad; --gc: #c98446; --gd: #7a431a; --ge: #a9612b; --gk: #5e3112; --gh: #5a2e0c; position: relative; flex: none; display: inline-block; width: 44px; height: 51px; }
.gds svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gds .g0 { stop-color: var(--gl); } .gds .g1 { stop-color: var(--gc); } .gds .g2 { stop-color: var(--gd); }
.gds .ge, .gds .gl path { fill: var(--gk); } .gds .gq { fill: var(--gd); opacity: 0.6; }
.gds b.han { position: absolute; inset: 0 0 8% 0; display: grid; place-items: center; font-family: var(--f-han); font-weight: normal; font-size: 22px; line-height: 1; color: var(--gh); filter: drop-shadow(0 1.5px 0 rgba(255,255,255,.55)) drop-shadow(0 -1px 0 rgba(0,0,0,.3)); }
.gds.gbig { width: 84px; height: 98px; perspective: 420px; } .gds.gbig b.han { font-size: 40px; }

.gds .g3 { position: absolute; inset: 0; transform-style: preserve-3d; animation: gdtilt 5s ease-in-out infinite; }
.gds .g3 > .gf { transform: translateZ(6.5px); } .gds .g3 > b.han { transform: translateZ(7px); }
.gds .gnd { position: absolute; left: 12%; right: 12%; bottom: -9px; height: 10px; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.26), transparent 70%); transform: translateZ(-8px); }
.gds .gsh { position: absolute; inset: 4% 7% 14%; clip-path: polygon(50% 0, 100% 13%, 100% 50%, 90% 75%, 50% 100%, 10% 75%, 0 50%, 0 13%); overflow: hidden; transform: translateZ(7.5px); pointer-events: none; }
.gds .gsh::after { content: ""; position: absolute; top: -20%; left: -70%; width: 38%; height: 140%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.8), transparent); transform: skewX(-15deg); animation: gdsweep 3.2s ease-in-out infinite; }
.gsp { position: absolute; width: 12px; height: 12px; pointer-events: none; animation: gdtw 1.9s ease-in-out infinite; }
.gsp::before { content: ""; position: absolute; inset: 0; background: #fff; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); filter: drop-shadow(0 0 3px #ffe9a8); }
.gds .gsp { top: 3%; right: 6%; transform: translateZ(9px); }
.gds .gsp.s2 { top: auto; right: auto; bottom: 26%; left: -2%; animation-delay: 0.8s; }
.gds .gsp.s3 { top: 40%; right: -6%; width: 9px; height: 9px; animation-delay: 1.3s; }
@keyframes gdtilt { 0%, 100% { transform: rotateY(-30deg) rotateX(6deg); } 50% { transform: rotateY(30deg) rotateX(6deg); } }
@keyframes gdspin { 0% { transform: rotateY(-540deg) scale(0.4); } 100% { transform: rotateY(-30deg) rotateX(6deg) scale(1); } }
@keyframes gdsweep { 0%, 50% { left: -70%; } 100% { left: 140%; } }
@keyframes gdtw { 0%, 100% { opacity: 0; scale: 0; rotate: 0deg; } 50% { opacity: 1; scale: 1; rotate: 45deg; } }

.modal .box { background: var(--surface); border-radius: 16px; max-width: 640px; width: 100%; max-height: 90vh; max-height: calc(100dvh - 32px); margin: auto; overflow: auto; padding: 18px; position: relative; }

.xpfly { position: fixed; z-index: 61; font-weight: 800; font-size: 1.15rem; color: var(--gold); pointer-events: none; white-space: nowrap; text-shadow: 0 1px 0 var(--bg), 0 0 8px var(--bg); opacity: 0; }
.xpfly.go { animation: fly 1.25s ease-out forwards; }
.xpbadge { left: calc(50% + var(--side, 0px) / 2 - 45px); top: calc(64px + env(safe-area-inset-top, 0px)); padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--gold) 16%, var(--surface, var(--bg))); border: 2px solid var(--gold); text-shadow: none; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
@keyframes fly { 0% { opacity: 0; transform: translateY(6px) scale(0.6); } 15% { opacity: 1; transform: translateY(0) scale(1.25); } 30% { transform: translateY(-4px) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-46px) scale(1); } }
.pill.xp.bump { animation: bump 0.5s ease-out; color: var(--gold); border-color: var(--gold); }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
.lvup { position: fixed; inset: 0 0 0 var(--side, 0px); z-index: 62; display: grid; place-items: center; pointer-events: none; animation: lvfade 2.6s ease-out forwards; }
.lvcard { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px 34px; border-radius: 18px; background: var(--surface, var(--bg)); border: 3px solid var(--gold); box-shadow: 0 12px 40px rgba(0,0,0,.28); text-align: center; max-width: calc(100% - 32px); animation: lvpop 0.6s cubic-bezier(.2,1.6,.4,1); }
.lvcard b { font-size: 1.8rem; color: var(--gold); }
.lvcard span { color: var(--muted, var(--ink)); }
.lvs { color: var(--gold); letter-spacing: 6px; font-size: 1.1rem; animation: lvspin 1.2s ease-out; }
@keyframes lvpop { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes lvfade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes lvspin { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes pop { 0% { transform: scale(0.96); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
.pop { animation: pop 0.25s ease-out; }
@media (prefers-reduced-motion: reduce) { .xpfly.go, .pop, .pill.xp.bump, .lvcard, .lvs { animation: none; } .xpfly.go { opacity: 1; } }
