<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b03a2e">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Hán cổ tự học</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* Layout: ứng dụng một cột — thanh trên (tên app, cấp độ, chuỗi ngày) + thanh chọn mục dính; mỗi mục là một màn hình riêng */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #f7f9fb;
  --ink: #17202b;
  --han: #1b2f4e;
  --muted: #5e6977;
  --line: #dce2e8;
  --accent: #24507f;
  --accent-ink: #ffffff;
  --accent-soft: #e2eaf4;
  --seal: #b03a2e;
  --seal-soft: #f8e6e3;
  --good: #1f7a4d;
  --good-soft: #e1f3e9;
  --warn: #a36307;
  --warn-soft: #fbefdc;
  --gold: #b7860b;
  --nt-purple: #7a3fa6; --nt-yel: #fff1a6;
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-han: "MS Song", "MSSong", "SimSun", "宋体", "PMingLiU", "MingLiU", "Noto Serif TC", serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #18202a; --surface-2: #1d2631; --ink: #e6eaef; --han: #dce7f6; --muted: #9ba6b4; --line: #2a3441;
    --accent: #8db4e2; --accent-ink: #0f1722; --accent-soft: #1f2e40; --seal: #e6897b; --seal-soft: #3b2321;
    --good: #6fcf9b; --good-soft: #17362a; --warn: #f0b45a; --warn-soft: #3a2c15; --gold: #e2b843; --nt-purple: #c7a2ec; --nt-yel: #4d4413; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #18202a; --surface-2: #1d2631; --ink: #e6eaef; --han: #dce7f6; --muted: #9ba6b4; --line: #2a3441;
  --accent: #8db4e2; --accent-ink: #0f1722; --accent-soft: #1f2e40; --seal: #e6897b; --seal-soft: #3b2321;
  --good: #6fcf9b; --good-soft: #17362a; --warn: #f0b45a; --warn-soft: #3a2c15; --gold: #e2b843; --nt-purple: #c7a2ec; --nt-yel: #4d4413; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
.han { font-family: var(--f-han); color: var(--han); font-weight: 400; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
/* thanh trên: 1 khối duy nhất; hẹp → 2 hàng (tên app + điểm, rồi thanh mục); rộng hoặc máy nằm ngang thấp → 1 hàng (xem @media cuối file) */
.topbar .tb { display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; padding-top: 10px; }
.topbar .brand { order: 1; }
.topbar .stats { order: 2; }
.topbar nav.menu { order: 3; flex: 1 0 100%; margin-top: 8px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
.brand .seal { width: 34px; height: 34px; border-radius: 7px; background: var(--seal); color: #fff; display: grid; place-items: center; font-family: var(--f-han); font-size: 22px; line-height: 1; }
.stats { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; }
.pill.streak { color: var(--warn); }
.pill.lv { color: var(--accent); }
nav.menu { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
nav.menu::-webkit-scrollbar { display: none; }
nav.menu a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.9rem; padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
nav.menu a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav.menu a .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--seal); color: #fff; font-size: 0.72rem; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
/* thanh mục ở trên (khung hẹp / dọc): mục không vừa 1 hàng dồn vào nút » cuối hàng (fitMenu trong app.js). Ký hiệu chữ Hán + nhãn ngắn chỉ dùng ở thanh dọc (xem @media cuối file) */
nav.menu a .ic, nav.menu a .sl, .mtog, .msrt { display: none; }
nav.menu a .ic { font-family: var(--f-han); font-weight: 400; line-height: 1; }
nav.menu .mhid { display: none !important; }
.mmore { position: relative; flex: none; margin-left: auto; min-width: 44px; padding: 5px 12px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 800; font-size: 1rem; line-height: 1.2; cursor: pointer; }
.mmore:hover, .mmore[aria-expanded="true"] { color: var(--ink); background: var(--accent-soft); }
.mmore.cur { background: var(--accent); color: var(--accent-ink); }
.mmore .dot { display: none; position: absolute; top: 2px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--seal); border: 2px solid var(--surface); }
.mmore.has-b .dot { display: block; }
.mtog, .msrt { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; place-items: center; font-size: 1rem; padding: 0; flex: none; }
.mtog:hover, .msrt:hover { color: var(--ink); border-color: var(--accent); }
/* danh sách mục ẩn (bấm ») + khung sắp xếp thanh mục */
.pop a.pmi { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 600; }
.pop a.pmi:hover, .pop a.pmi:focus-visible { background: var(--accent-soft); color: var(--accent); }
.pop a.pmi[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.pop .ic, .msort .ic { font-family: var(--f-han); font-weight: 400; width: 22px; text-align: center; font-size: 19px; line-height: 1; flex: none; }
.pop .badge { margin-left: auto; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--seal); color: #fff; font-size: 0.72rem; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.msort { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.msort li { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.msort li .no { color: var(--muted); font-size: 0.8rem; width: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.msort li .lb { flex: 1; min-width: 0; font-weight: 600; }
.msort li .btn { min-width: 44px; min-height: 40px; padding: 4px 10px; }
.msort li.vis { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.modal .acts { background: var(--surface); }

main { padding-block: 18px 64px; }
main:focus { outline: none; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.45rem; margin: 0 0 4px; }
h2 { font-size: 1.12rem; margin: 0 0 8px; }
h3 { font-size: 1rem; margin: 14px 0 6px; }
p { margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 0.92rem; }
.grid { display: grid; gap: 14px; }
.cols2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card.hero { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); min-height: 40px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.bad { background: var(--seal); border-color: var(--seal); color: #fff; }
.btn.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 0.86rem; }
.btn:disabled { opacity: 0.45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 0.76rem; white-space: nowrap; }
.chip.k10 { background: var(--seal-soft); color: var(--seal); }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.nb { color: var(--muted); font-style: italic; }
.nb::before { content: "※ "; font-style: normal; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* tasks + progress */
.task { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.task .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-han); font-size: 24px; background: var(--accent-soft); color: var(--accent); }
.task .ic.red { background: var(--seal-soft); color: var(--seal); }
.task .ic.green { background: var(--good-soft); color: var(--good); }
.task .ic.amber { background: var(--warn-soft); color: var(--warn); }
.task b { display: block; }
.task small { color: var(--muted); }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
.bar i.a { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.bar i.b { background: var(--accent); }
.bar i.c { background: var(--good); height: 40%; top: auto; }
.prog { display: grid; gap: 4px; padding: 8px 0; }
.prog .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; flex-wrap: wrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--k); }
.weeks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0 4px; }
.weeks div { border-radius: 8px; padding: 6px 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 0.78rem; min-width: 0; }
.weeks div.now { border-color: var(--accent); background: var(--accent-soft); }
.weeks div.done { opacity: 0.6; }
.weeks b { display: block; font-size: 0.82rem; }
/* lộ trình theo kỳ (26/11/2026): dòng từng kỳ + thanh chặng, tiêu đề kỳ trong "Việc hôm nay", khung chọn kỳ */
.kyrow { margin-top: 12px; display: grid; gap: 4px; min-width: 0; }
.kyrow .row { gap: 4px 10px; }
.phbar { position: relative; display: flex; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.phbar span { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; border-right: 1px solid var(--surface); }
.phbar span:last-of-type { border-right: 0; }
.phbar small { font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; color: var(--ink); }
.phbar .ph0 { background: var(--accent-soft); }
.phbar .ph1 { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.phbar .ph2 { background: var(--good-soft); }
.phbar .ph3 { background: var(--seal-soft); }
.phbar i { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
h3.ksec { margin: 16px 0 2px; font-size: 1.02rem; color: var(--accent); }
h3.ksec:first-of-type { margin-top: 6px; }
h3.ksec small { font-weight: 500; font-size: 0.82rem; }
.kypick { display: grid; gap: 10px; margin: 10px 0 12px; }
.kyp { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
.kyp.on { border-color: var(--accent); }
.kyon { gap: 4px 10px; cursor: pointer; }
.kyon input { width: 20px; height: 20px; }
.kyset { margin-top: 8px; align-items: end; gap: 8px 12px; }
.kywk { gap: 6px; }
.kypv { margin: 8px 0 0; }
.kysched { margin-top: 14px; padding-top: 4px; border-top: 1px solid var(--line); }
.kysched:first-of-type { border-top: 0; }
.sw4 { display: grid; gap: 6px; text-align: center; padding: 8px 4px; }
.sw4 .am { font-size: 1.2rem; font-weight: 700; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.bdg { display: grid; justify-items: center; gap: 2px; width: 84px; text-align: center; font-size: 0.72rem; color: var(--muted); }
.bdg .m { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-han); font-size: 22px; border: 2px dashed var(--line); color: var(--muted); }
.bdg.on .m { border: 2px solid var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
.bdg.on { color: var(--ink); }

/* flashcards */
.stage { display: grid; gap: 14px; justify-items: center; }
.fc { width: min(560px, 100%); min-height: 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; align-content: center; justify-items: center; gap: 10px; text-align: center; position: relative; }
.fc .kind { position: absolute; top: 12px; left: 14px; font-size: 0.75rem; color: var(--muted); font-weight: 600; }
.fc .cnt { position: absolute; top: 12px; right: 14px; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.big { font-family: var(--f-han); color: var(--han); line-height: 1.1; font-size: clamp(64px, 18vw, 120px); }
.big.l2 { font-size: clamp(48px, 13vw, 88px); } .big.l3 { font-size: clamp(40px, 10vw, 72px); } .big.l4 { font-size: clamp(32px, 8vw, 56px); } .big.l6 { font-size: clamp(24px, 6vw, 40px); line-height: 1.4; }
.ans { display: grid; gap: 4px; justify-items: center; }
.ans .am { font-size: 1.35rem; font-weight: 700; }
.ans .ns { max-width: 46ch; }
.ans .extra { font-size: 0.85rem; color: var(--muted); max-width: 52ch; }
.grades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(560px, 100%); }
.grades .btn { flex-direction: column; gap: 0; padding: 8px; }
.grades .btn small { font-weight: 500; opacity: 0.8; font-size: 0.72rem; }
.kbd { font-size: 0.75rem; color: var(--muted); }
.hide { visibility: hidden; }
/* hàng nút / khung kết quả đang ẩn thì KHÔNG giữ chỗ (chỉ đáp án trong thẻ .fc giữ chỗ để thẻ không nhảy) */
.row.hide, .gfb.hide, .gtwrap.hide, .acts.hide { display: none; }

/* learn detail */
.learn { width: min(640px, 100%); display: grid; gap: 12px; }
.learn .top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.learn .top .big:not(.l2):not(.l3):not(.l4):not(.l6) { font-size: clamp(72px, 20vw, 112px); }
.learn .top.nobig { grid-template-columns: minmax(0, 1fr); }
/* hoạt hình thứ tự nét (thay chữ to): nền ô có đường kẻ, nét đang viết đỏ, nét đã viết màu chữ Hán */
.ani { --c: clamp(150px, 44vw, 200px); display: grid; justify-items: center; gap: 4px; }
.ani.n2 { --c: clamp(104px, 30vw, 132px); } .ani.n4 { --c: clamp(60px, 17vw, 84px); } .ani.n6 { --c: clamp(46px, 12vw, 62px); }
.acells { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(var(--c) * 4 + 18px); cursor: pointer; }
.acell { width: var(--c); height: var(--c); border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.acell svg { width: 100%; height: 100%; display: block; }
.acell .agrid { fill: none; stroke: var(--line); stroke-width: 5; stroke-dasharray: 22 18; }
.acell .ao { fill: var(--line); }
.acell .as { fill: none; stroke: var(--han); stroke-width: 200; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
.acell .as.on { stroke: var(--seal); visibility: visible; }
.acell .as.dn { visibility: visible; }
.acell.nodata .big { font-size: calc(var(--c) * 0.72); line-height: 1; }
.areplay { position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0; }
.ani.n4 .areplay, .ani.n6 .areplay { width: 24px; height: 24px; font-size: 14px; right: -4px; bottom: -4px; }
.anote { font-size: 0.75rem; color: var(--muted); max-width: calc(var(--c) * 4); text-align: center; }
.anote:empty { display: none; }
/* phần bộ trong chữ (tô màu) + ô hoạt hình nhỏ cho dạng rút gọn / dạng bộ / chữ ví dụ */
.acell .ao.rb { fill: color-mix(in srgb, var(--warn) 30%, var(--line)); }
.acell .as.rb.dn { stroke: var(--warn); }
.ani.sm { --c: clamp(64px, 18vw, 84px); } .ani.sm.n2 { --c: clamp(52px, 14vw, 66px); } .ani.sm.n4 { --c: 42px; } .ani.sm.n6 { --c: 34px; }
.ani.xs { --c: 50px; } .ani.xs .areplay { display: none; }
.ani.sm .areplay { width: 22px; height: 22px; font-size: 13px; right: -4px; bottom: -4px; }
.ani.sm .acell, .ani.xs .acell { border-radius: 8px; }
.big.sm, .big.xs { font-size: 40px; }
.alt { display: grid; gap: 8px; }
.altrow { display: flex; gap: 12px; align-items: flex-start; padding-top: 8px; border-top: 1px dashed var(--line); }
.altrow > .ani { flex: none; }
.altt { display: grid; gap: 3px; min-width: 0; font-size: 0.9rem; }
.gtt { font-size: 1.9rem; line-height: 1.15; }
.extra .gtt { font-size: 1.15rem; }
.fex { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.fx { display: grid; justify-items: center; gap: 2px; font-size: 0.82rem; text-align: center; }
a.lk { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
.gtwrap { display: grid; gap: 8px; justify-items: center; width: 100%; padding-top: 10px; border-top: 1px dashed var(--line); }
.learn .sent ruby { margin: 0 0.12em; }
.facts { display: grid; gap: 6px; font-size: 0.92rem; }
.facts .k { color: var(--muted); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.pace { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start; margin: 12px 0; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); }
.pace .pi { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-han); font-size: 30px; line-height: 1; }
.pace .ph { font-size: 1.35rem; display: block; margin-bottom: 2px; }
.pace .sub { margin: 4px 0 0; }

/* ===== BỐ CỤC CHUNG CHO 3 LOẠI MÁY (điện thoại, máy tính bảng, máy tính) =====
   .acts  = thanh nút chính của mỗi bước (Xem đáp án, Quên/Nhớ, Chấm điểm, Tiếp…): dính đáy màn hình khi nội dung dài,

.memo { width: min(560px, 100%, max(280px, (100dvh - 170px) * 1.3)); }

.tc0 { color: var(--ink); } .tc1 { color: var(--seal); } .tc2 { color: var(--accent); } .tc3 { color: var(--good); } .tc4 { color: var(--warn); } .tc5 { color: var(--nt-purple); } .tc6 { color: var(--muted); }
